# GeoMesa DynamoDB Configuration Reference
# This file contains default configuration values for GeoMesa DynamoDB

geomesa {
  dynamodb {
    # Default system properties
    write.batch = 25
    tx.retry = 10
    tx.pause = "100ms"
    tx.backoff = "1,1,2,2,5,10,20"
    age.off.interval = "10 minutes"
    max.batch.size = 25
    default.region = "us-east-1"
    
    # Connection settings
    connection {
      timeout = "30s"
      socket.timeout = "30s"
      max.retries = 3
      retry.delay = "100ms"
    }
    
    # Table settings
    table {
      billing.mode = "PAY_PER_REQUEST"
      read.capacity = 5
      write.capacity = 5
      create.tables = true
    }
    
    # Performance settings
    batch.size = 25
    
    # Query settings
    query {
      threads = 4
      timeout = "30s"
      loose.bbox = false
      parallel.partition.scans = true
    }
  }
}
